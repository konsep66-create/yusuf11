<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kumarhane Monopoly — Three.js 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0806;color:#eee;font-family:system-ui,Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#12100e;border-bottom:1px solid #333;gap:8px}
.room{font-size:20px;font-weight:700;color:#22c55e;letter-spacing:2px}
.pill{padding:8px 14px;border-radius:20px;font-weight:700;font-size:13px;border:2px solid #444;background:#1a1a1a}
.pill.me{border-color:#22c55e;background:#14532d;color:#86efac}
.pill.wait{color:#a8a29e}
.main{flex:1;display:grid;grid-template-columns:220px 1fr 240px;min-height:0}
.side{padding:10px;overflow-y:auto;background:#100e0c;border-right:1px solid #222}
.side.r{border-right:0;border-left:1px solid #222}
.card{background:#1c1917;border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:8px}
.card.on{border-color:#22c55e;box-shadow:0 0 12px #22c55e33}
.money{font-size:18px;color:#fbbf24;font-weight:700}
#canvas-wrap{position:relative;min-height:0;background:#0c0a08}
#c3d{width:100%;height:100%;display:block}
.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#666;pointer-events:none}
button{padding:9px 12px;border:0;border-radius:8px;font-weight:700;cursor:pointer;background:#22c55e;color:#fff;font-size:13px;width:100%;margin-top:6px}
button:disabled{opacity:.4;cursor:not-allowed}
.red{background:#dc2626}.gold{background:#b8860b}
.log{font-size:11px;color:#888;max-height:160px;overflow:auto}
#lobby{position:fixed;inset:0;background:#0a0806;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20}
#lobby input{padding:12px;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#fff;text-align:center;width:200px}
#game{display:none;flex-direction:column;height:100%}
</style>
</head>
<body>
<div id="lobby">
  <h1>🎲 Kumarhane Monopoly 3D</h1>
  <p style="color:#888;font-size:13px">Three.js tahta · 3 oyuncu</p>
  <input id="nameInput" maxlength="16" placeholder="İsmin">
  <button id="createRoom" style="width:auto;padding:12px 28px">Oda Oluştur</button>
  <div style="display:flex;gap:8px">
    <input id="roomInput" maxlength="4" placeholder="Oda kodu" style="width:110px">
    <button id="joinRoom" style="width:auto">Katıl</button>
  </div>
  <div id="lobbyMsg" style="color:#f87171"></div>
  <div id="created" style="color:#22c55e;font-size:22px;font-weight:700;letter-spacing:3px"></div>
</div>

<div id="game">
  <div class="top">
    <div>ODA: <span class="room" id="roomCode">----</span></div>
    <div class="pill wait" id="turnPill">Sıra</div>
    <div id="msg" style="font-size:12px;color:#aaa;max-width:320px;text-align:right"></div>
  </div>
  <div class="main">
    <div class="side">
      <div class="card" id="pc0"><div id="n0">P1</div><div class="money"><span id="m0">1500</span> ₺</div><div>Kare <span id="pos0">0</span></div></div>
      <div class="card" id="pc1"><div id="n1">P2</div><div class="money"><span id="m1">1500</span> ₺</div><div>Kare <span id="pos1">0</span></div></div>
      <div class="card" id="pc2"><div id="n2">P3</div><div class="money"><span id="m2">1500</span> ₺</div><div>Kare <span id="pos2">0</span></div></div>
      <button id="rollBtn">🎲 Zar at</button>
      <button id="leaveBtn" class="red">Çık</button>
      <div id="adminBox" style="display:none;margin-top:10px">
        <button class="gold" id="adminToggle">Admin ışınlan</button>
        <div id="teleports" style="display:none;max-height:140px;overflow:auto;margin-top:6px"></div>
      </div>
    </div>
    <div id="canvas-wrap">
      <canvas id="c3d"></canvas>
      <div class="hint">Sabit 3D kamera · tahta dönmez</div>
    </div>
    <div class="side r">
      <div class="card"><b>Zar</b><div id="diceTxt" style="font-size:22px;color:#fbbf24;margin-top:6px">-</div></div>
      <div class="card"><b>Günlük</b><div class="log" id="log"></div></div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getDatabase,ref,set,get,onValue,runTransaction,update} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyBm7FzmrMpKpVvKPIRrnv5yhy6T-MaD-Kw",
  authDomain:"yusuf11-5ecc9.firebaseapp.com",
  databaseURL:"https://yusuf11-5ecc9-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"yusuf11-5ecc9",
  storageBucket:"yusuf11-5ecc9.firebasestorage.app",
  messagingSenderId:"418982485830",
  appId:"1:418982485830:web:ff0b051026d0256f1b0f47"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app);
const $=id=>document.getElementById(id);

const NAMES=[
  "BAŞLANGIÇ","Kırmızı Sokak","Şans","Mavi Sokak","HAPİS","İstasyon","Vergi","Yeşil Sokak",
  "BLACKJACK","Sarı Sokak","Otopark","Kumarhane","Mor Sokak","Şans","Elektrik","Turuncu Sokak",
  "POKER","Kırmızı 2","Vergi","Lacivert","HAPİS!","İstasyon 2","Şans","Yeşil 2",
  "JACKPOT","Turuncu 2","Vergi","Mavi 2","Şans","Kırmızı 3","İstasyon 3","SON"
];
const COLORS=[
  0x166534,0x7f1d1d,0x1e3a5f,0x1e3a8a,0x450a0a,0x292524,0x3f3f46,0x14532d,
  0x92400e,0xa16207,0x3f6212,0x5b21b6,0x5b21b6,0x1e3a5f,0x0e7490,0x9a3412,
  0x4c1d95,0x7f1d1d,0x3f3f46,0x1e3a8a,0x7f1d1d,0x292524,0x1e3a5f,0x14532d,
  0x854d0e,0x9a3412,0x3f3f46,0x1e3a8a,0x1e3a5f,0x7f1d1d,0x292524,0x166534
];

let roomCode=null,playerNumber=null,unsub=null,playerName="";
let scene,camera,renderer,boardGroup,pieceMeshes=[null,null,null];
let cellWorld=[]; // {x,z} for each cell index
let animating=false;

function path(){return ref(db,"rooms/"+roomCode)}
function code4(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function nextTurn(d,from){for(let i=1;i<=3;i++){const t=(from+i)%3;if(d.players?.[t])return t}return from}
function log(t){const e=document.createElement("div");e.textContent=new Date().toLocaleTimeString("tr-TR")+" — "+t;$("log").prepend(e)}

/* ========== THREE.JS 3D TAHTA ========== */
function cellXZ(i){
  // 32 hücre, kare halka (Business Tour tarzı masa)
  const side=8; // her kenar 8 hücre (köşeler paylaşımlı mantık: 0..7 alt, 8..15 sağ, 16..23 üst, 24..31 sol)
  const span=7; // merkezden uzaklık
  const step=(span*2)/7;
  if(i>=0&&i<=7){ // alt: sol → sağ
    return {x:-span+i*step, z:span};
  }
  if(i>=8&&i<=15){ // sağ: alt → üst
    return {x:span, z:span-(i-7)*step};
  }
  if(i>=16&&i<=23){ // üst: sağ → sol
    return {x:span-(i-15)*step, z:-span};
  }
  // sol: üst → alt
  return {x:-span, z:-span+(i-23)*step};
}

function init3D(){
  const wrap=$("canvas-wrap");
  const canvas=$("c3d");
  const w=wrap.clientWidth,h=wrap.clientHeight;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0c0a08);
  scene.fog=new THREE.Fog(0x0c0a08,18,42);

  camera=new THREE.PerspectiveCamera(42,w/h,0.1,100);
  // Sabit açı — tahta dönmez
  camera.position.set(0,16,14);
  camera.lookAt(0,0,0);

  renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setSize(w,h);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;

  // Işıklar
  const amb=new THREE.AmbientLight(0xffe6c8,0.45);
  scene.add(amb);
  const dir=new THREE.DirectionalLight(0xfff0dd,1.15);
  dir.position.set(6,20,8);
  dir.castShadow=true;
  dir.shadow.mapSize.set(1024,1024);
  scene.add(dir);
  const fill=new THREE.PointLight(0x88aaff,0.35,40);
  fill.position.set(-8,8,-6);
  scene.add(fill);

  // Masa (altı)
  const tableGeo=new THREE.CylinderGeometry(13,13.5,0.6,64);
  const tableMat=new THREE.MeshStandardMaterial({color:0x3d2914,roughness:0.65,metalness:0.05});
  const table=new THREE.Mesh(tableGeo,tableMat);
  table.position.y=-0.4;
  table.receiveShadow=true;
  scene.add(table);

  // Keçe / tahta zemini
  const felt=new THREE.Mesh(
    new THREE.BoxGeometry(11.2,0.15,11.2),
    new THREE.MeshStandardMaterial({color:0x0d3d24,roughness:0.9})
  );
  felt.position.y=0.05;
  felt.receiveShadow=true;
  scene.add(felt);

  boardGroup=new THREE.Group();
  scene.add(boardGroup);
  cellWorld=[];

  const tileW=1.15,tileH=0.28,tileD=1.15;
  for(let i=0;i<32;i++){
    const {x,z}=cellXZ(i);
    cellWorld.push({x,z});
    const geo=new THREE.BoxGeometry(tileW,tileH,tileD);
    const mat=new THREE.MeshStandardMaterial({
      color:COLORS[i],
      roughness:0.55,
      metalness:0.08
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(x,tileH/2+0.12,z);
    mesh.castShadow=true;
    mesh.receiveShadow=true;
    boardGroup.add(mesh);

    // İnce çerçeve
    const edge=new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.35})
    );
    edge.position.copy(mesh.position);
    boardGroup.add(edge);

    // Küçük numara (sprite yerine basit üst işaret)
    if(i===0||i===8||i===16||i===24){
      const corner=new THREE.Mesh(
        new THREE.BoxGeometry(0.2,0.08,0.2),
        new THREE.MeshStandardMaterial({color:0xfbbf24})
      );
      corner.position.set(x,tileH+0.2,z);
      boardGroup.add(corner);
    }
  }

  // Piyonlar — 3D silindir fiş
  const pieceColors=[0xf59e0b,0x3b82f6,0x22c55e];
  for(let p=0;p<3;p++){
    const g=new THREE.Group();
    const body=new THREE.Mesh(
      new THREE.CylinderGeometry(0.28,0.32,0.35,24),
      new THREE.MeshStandardMaterial({color:pieceColors[p],roughness:0.35,metalness:0.25})
    );
    body.castShadow=true;
    body.position.y=0.35;
    const top=new THREE.Mesh(
      new THREE.CylinderGeometry(0.22,0.22,0.12,24),
      new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4,metalness:0.1})
    );
    top.position.y=0.58;
    top.castShadow=true;
    g.add(body);g.add(top);
    g.position.set(cellWorld[0].x + (p-1)*0.35, 0.2, cellWorld[0].z);
    g.visible=false;
    scene.add(g);
    pieceMeshes[p]=g;
  }

  window.addEventListener("resize",()=>{
    const w2=wrap.clientWidth,h2=wrap.clientHeight;
    camera.aspect=w2/h2;camera.updateProjectionMatrix();
    renderer.setSize(w2,h2);
  });

  function loop(){
    requestAnimationFrame(loop);
    renderer.render(scene,camera);
  }
  loop();
}

function setPiecePos(p,cellIndex,instant=false){
  const mesh=pieceMeshes[p];
  if(!mesh||!cellWorld[cellIndex])return;
  const base=cellWorld[cellIndex];
  const ox=(p-1)*0.32;
  const target=new THREE.Vector3(base.x+ox,0.2,base.z);
  if(instant){mesh.position.copy(target);return}
  // Basit animasyon
  const start=mesh.position.clone();
  const t0=performance.now();
  const dur=280;
  function step(now){
    const t=Math.min(1,(now-t0)/dur);
    const e=t*t*(3-2*t);
    mesh.position.lerpVectors(start,target,e);
    mesh.position.y=0.2+Math.sin(e*Math.PI)*0.45;
    if(t<1)requestAnimationFrame(step);
    else mesh.position.copy(target);
  }
  requestAnimationFrame(step);
}

async function animatePath(p,from,to){
  if(from===to){setPiecePos(p,to,true);return}
  animating=true;
  let cur=from;
  while(cur!==to){
    cur=(cur+1)%32;
    await new Promise(r=>{
      setPiecePos(p,cur,false);
      setTimeout(r,220);
    });
  }
  animating=false;
}

/* ========== OYUN ========== */
async function createGame(){
  playerName=($("nameInput").value||"").trim();
  if(!playerName){$("lobbyMsg").textContent="İsim yaz";return}
  try{
    let code;while(true){code=code4();if(!(await get(ref(db,"rooms/"+code))).exists())break}
    roomCode=code;playerNumber=0;
    const props={};for(let i=0;i<32;i++)props[i]={owner:null};
    await set(ref(db,"rooms/"+code),{
      players:{0:{name:playerName,money:1500,position:0,props:[],jailTurns:0},1:null,2:null},
      properties:props,turn:0,message:playerName+" oda kurdu",lastDice:[0,0],game:null
    });
    $("created").textContent="ODA: "+code;
    enterGame();
  }catch(e){$("lobbyMsg").textContent=e.message}
}

async function joinGame(){
  playerName=($("nameInput").value||"").trim();
  if(!playerName){$("lobbyMsg").textContent="İsim yaz";return}
  const code=$("roomInput").value.trim().toUpperCase();
  if(code.length!==4){$("lobbyMsg").textContent="4 haneli kod";return}
  try{
    const snap=await get(ref(db,"rooms/"+code));
    if(!snap.exists()){$("lobbyMsg").textContent="Oda yok";return}
    const d=snap.val();
    if(d.players?.[1]&&d.players?.[2]){$("lobbyMsg").textContent="Dolu 3/3";return}
    const slot=d.players?.[1]?2:1;
    await set(ref(db,"rooms/"+code+"/players/"+slot),{name:playerName,money:1500,position:0,props:[],jailTurns:0});
    await update(ref(db,"rooms/"+code),{message:playerName+" katıldı"});
    roomCode=code;playerNumber=slot;enterGame();
  }catch(e){$("lobbyMsg").textContent=e.message}
}

function enterGame(){
  $("lobby").style.display="none";
  $("game").style.display="flex";
  $("roomCode").textContent=roomCode;
  $("adminBox").style.display=playerNumber===0?"block":"none";
  init3D();
  buildAdmin();
  unsub=onValue(path(),snap=>{const d=snap.val();if(d)render(d)});
}

let lastPos={0:-1,1:-1,2:-1};
async function render(d){
  // Hapiste sıra otomatik atla
  const tp=d.players?.[d.turn];
  if(tp&&(tp.jailTurns||0)>0&&!d.game){
    runTransaction(path(),data=>{
      if(!data)return;
      const pl=data.players?.[data.turn];
      if(!pl||!(pl.jailTurns>0))return;
      pl.jailTurns-=1;
      data.turn=nextTurn(data,data.turn);
      data.message=`${pl.name} hapiste atlandı → ${data.players[data.turn]?.name||""}`;
      return data;
    });
  }

  [0,1,2].forEach(i=>{
    const p=d.players?.[i];
    $("pc"+i).style.display=p?"block":"none";
    $("pc"+i).classList.toggle("on",d.turn===i);
    if(!p){if(pieceMeshes[i])pieceMeshes[i].visible=false;return}
    $("n"+i).textContent=(i===0?"👑 ":"👤 ")+p.name;
    $("m"+i).textContent=p.money;
    $("pos"+i).textContent=p.position;
    if(pieceMeshes[i]){
      pieceMeshes[i].visible=true;
      const pos=p.position||0;
      if(lastPos[i]<0){setPiecePos(i,pos,true);lastPos[i]=pos}
      else if(lastPos[i]!==pos&&!animating){
        const from=lastPos[i];lastPos[i]=pos;
        animatePath(i,from,pos);
      }
    }
  });

  const pill=$("turnPill");
  if(d.turn===playerNumber){pill.textContent="🎲 SENİN SIRAN";pill.className="pill me"}
  else{pill.textContent="⏳ Sıra: "+(d.players?.[d.turn]?.name||"-");pill.className="pill wait"}
  $("msg").textContent=d.message||"";
  $("rollBtn").disabled=d.turn!==playerNumber||animating||!!d.game||(d.players?.[playerNumber]?.jailTurns>0);
  if(d.lastDice?.[0])$("diceTxt").textContent=d.lastDice[0]+" + "+d.lastDice[1]+" = "+(d.lastDice[0]+d.lastDice[1]);
}

async function rollDice(){
  await runTransaction(path(),d=>{
    if(!d||d.turn!==playerNumber||!d.players?.[playerNumber])return;
    const p=d.players[playerNumber];
    if((p.jailTurns||0)>0){
      p.jailTurns-=1;d.turn=nextTurn(d,playerNumber);
      d.message=`${p.name} hapiste atlandı`;return d;
    }
    const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);
    d.lastDice=[a,b];
    const old=p.position||0;
    p.position=(old+a+b)%32;
    if(p.position<old)p.money+=200;
    d.message=`${p.name} ${a}+${b} → ${NAMES[p.position]}`;
    d.turn=nextTurn(d,playerNumber);
    if(NAMES[p.position]==="HAPİS!"||p.position===20){p.position=4;p.jailTurns=1;d.message=`${p.name} hapse girdi`}
    return d;
  });
}

function buildAdmin(){
  const box=$("teleports");box.innerHTML="";
  NAMES.forEach((n,i)=>{
    const b=document.createElement("button");
    b.textContent=i+" "+n;b.style.fontSize="10px";b.style.marginTop="3px";
    b.onclick=()=>runTransaction(path(),d=>{
      if(!d?.players?.[0])return;
      d.players[0].position=i;d.message="Admin → "+n;return d;
    });
    box.appendChild(b);
  });
}
$("adminToggle").onclick=()=>{
  const t=$("teleports");t.style.display=t.style.display==="none"?"block":"none";
};

$("createRoom").onclick=createGame;
$("joinRoom").onclick=joinGame;
$("rollBtn").onclick=rollDice;
$("leaveBtn").onclick=async()=>{
  if(roomCode)await runTransaction(path(),d=>{if(d?.players)d.players[playerNumber]=null;return d});
  location.reload();
};
</script>
</body>
</html>
