<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🎲 Kumarhane Monopoly</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/x-icon"
        href="./favicon.ico"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1e293b
                );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;

            font-size: 30px;
        }

        .panel {
            background: #1f2937;

            border: 1px solid #374151;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        p {
            color: #d1d5db;
            line-height: 1.5;
        }

        input {
            width: 100%;

            padding: 14px;

            margin: 8px 0;

            border: 1px solid #4b5563;

            border-radius: 10px;

            background: #111827;

            color: white;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #22c55e;
        }

        button {
            width: 100%;

            padding: 14px;

            margin: 8px 0;

            border: none;

            border-radius: 10px;

            background: #22c55e;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #16a34a;
            transform: translateY(-1px);
        }

        button.secondary {
            background: #3b82f6;
        }

        button.secondary:hover {
            background: #2563eb;
        }

        button.danger {
            background: #ef4444;
        }

        button.danger:hover {
            background: #dc2626;
        }

        hr {
            border: 0;

            border-top:
                1px solid #374151;

            margin: 22px 0;
        }

        .hidden {
            display: none !important;
        }

        .room-code {
            background: #111827;

            border:
                2px dashed #22c55e;

            border-radius: 12px;

            padding: 20px;

            text-align: center;

            margin: 20px 0;
        }

        .room-code span {
            display: block;

            font-size: 38px;

            font-weight: bold;

            letter-spacing: 8px;

            color: #22c55e;

            margin-top: 10px;
        }

        .players {
            margin-top: 20px;
        }

        .player {
            padding: 12px;

            margin: 8px 0;

            background: #111827;

            border-radius: 10px;

            border-left:
                4px solid #22c55e;
        }

        .status {
            padding: 12px;

            border-radius: 10px;

            background: #111827;

            margin-top: 15px;

            text-align: center;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .waiting {
            color: #facc15;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎲 Kumarhane Monopoly</h1>


    <!-- ========================= -->
    <!-- LOBBY -->
    <!-- ========================= -->

    <div
        id="lobby"
        class="panel"
    >

        <h2>🌐 Online Oyun</h2>

        <p>
            Bir oyuncu oda oluşturur,
            diğer oyuncu oda koduyla katılır.
        </p>


        <input
            id="nameInput"
            maxlength="14"
            placeholder="Adın (isteğe bağlı)"
        >


        <hr>


        <button id="createRoom">
            🏠 Oda Oluştur
        </button>


        <hr>


        <input
            id="roomInput"
            maxlength="4"
            placeholder="4 Haneli Oda Kodu"
            inputmode="numeric"
        >


        <button
            id="joinRoom"
            class="secondary"
        >
            🚪 Odaya Katıl
        </button>


        <div
            id="lobbyStatus"
            class="status hidden"
        ></div>

    </div>


    <!-- ========================= -->
    <!-- ROOM -->
    <!-- ========================= -->

    <div
        id="roomPanel"
        class="panel hidden"
    >

        <h2>🎲 Oyun Odası</h2>


        <div class="room-code">

            Oda Kodu

            <span id="roomCodeDisplay">
                ----
            </span>

        </div>


        <div class="status">

            Durum:

            <strong id="roomStatus">
                Oyuncular bekleniyor...
            </strong>

        </div>


        <div class="players">

            <h3>👥 Oyuncular</h3>

            <div id="playersList">
                Henüz oyuncu yok.
            </div>

        </div>


        <button
            id="leaveRoom"
            class="danger"
        >
            🚪 Odadan Ayrıl
        </button>

    </div>

</div>


<!-- ====================================== -->
<!-- FIREBASE -->
<!-- ====================================== -->

<script type="module">

    /*
    =====================================================
    FIREBASE IMPORT
    =====================================================
    */

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getDatabase,
        ref,
        set,
        get,
        onValue,
        remove
    }
    from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /*
    =====================================================
    FIREBASE CONFIG
    =====================================================
    */

    const firebaseConfig = {

        apiKey:
            "AIzaSyBm7FzmrMpKpVvKPIRrnv5yhy6T-MaD-Kw",

        authDomain:
            "yusuf11-5ecc9.firebaseapp.com",

        databaseURL:
            "https://yusuf11-5ecc9-default-rtdb.europe-west1.firebasedatabase.app",

        projectId:
            "yusuf11-5ecc9",

        storageBucket:
            "yusuf11-5ecc9.firebasestorage.app",

        messagingSenderId:
            "418982485830",

        appId:
            "1:418982485830:web:ff0b051026d0256f1b0f47"
    };


    /*
    =====================================================
    FIREBASE BAŞLAT
    =====================================================
    */

    const app =
        initializeApp(firebaseConfig);


    const db =
        getDatabase(app);


    /*
    =====================================================
    HTML ELEMENTLERİ
    =====================================================
    */

    const lobby =
        document.getElementById("lobby");

    const roomPanel =
        document.getElementById("roomPanel");

    const nameInput =
        document.getElementById("nameInput");

    const roomInput =
        document.getElementById("roomInput");

    const createRoomButton =
        document.getElementById("createRoom");

    const joinRoomButton =
        document.getElementById("joinRoom");

    const leaveRoomButton =
        document.getElementById("leaveRoom");

    const lobbyStatus =
        document.getElementById("lobbyStatus");

    const roomCodeDisplay =
        document.getElementById("roomCodeDisplay");

    const roomStatus =
        document.getElementById("roomStatus");

    const playersList =
        document.getElementById("playersList");


    /*
    =====================================================
    OYUNCU BİLGİLERİ
    =====================================================
    */

    let currentRoom = null;

    let currentPlayer = null;

    let playersListener = null;


    /*
    =====================================================
    DURUM MESAJI
    =====================================================
    */

    function showStatus(
        message,
        type = ""
    ) {

        lobbyStatus.textContent =
            message;

        lobbyStatus.className =
            "status";

        if (type) {

            lobbyStatus.classList.add(type);

        }

        lobbyStatus.classList.remove(
            "hidden"
        );
    }


    /*
    =====================================================
    RASTGELE 4 HANELİ ODA KODU
    =====================================================
    */

    function generateRoomCode() {

        return Math.floor(
            1000 +
            Math.random() * 9000
        ).toString();

    }


    /*
    =====================================================
    ODA OLUŞTUR
    =====================================================
    */

    createRoomButton.addEventListener(
        "click",
        async function () {

            try {

                const playerName =
                    nameInput.value.trim()
                    || "Oyuncu";


                createRoomButton.disabled =
                    true;


                showStatus(
                    "Oda oluşturuluyor...",
                    "waiting"
                );


                let roomCode;

                let roomExists = true;


                /*
                Aynı kod varsa
                yeni kod üret
                */

                while (roomExists) {

                    roomCode =
                        generateRoomCode();


                    const roomRef =
                        ref(
                            db,
                            "rooms/" +
                            roomCode
                        );


                    const snapshot =
                        await get(roomRef);


                    roomExists =
                        snapshot.exists();

                }


                /*
                Oyuncu ID
                */

                const playerId =
                    "player_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2, 8);


                /*
                Firebase'e oda yaz
                */

                await set(
                    ref(
                        db,
                        "rooms/" +
                        roomCode
                    ),
                    {

                        createdAt:
                            Date.now(),

                        status:
                            "waiting",

                        host:
                            playerId,

                        players: {

                            [playerId]: {

                                name:
                                    playerName,

                                joinedAt:
                                    Date.now(),

                                host:
                                    true

                            }

                        }

                    }
                );


                /*
                Mevcut odayı kaydet
                */

                currentRoom =
                    roomCode;

                currentPlayer =
                    playerId;


                /*
                Odayı göster
                */

                openRoom(
                    roomCode
                );


                console.log(
                    "Oda oluşturuldu:",
                    roomCode
                );


            }
            catch (error) {

                console.error(
                    "Oda oluşturma hatası:",
                    error
                );


                showStatus(
                    "Oda oluşturulamadı: " +
                    error.message,
                    "error"
                );

            }
            finally {

                createRoomButton.disabled =
                    false;

            }

        }
    );


    /*
    =====================================================
    ODAYA KATIL
    =====================================================
    */

    joinRoomButton.addEventListener(
        "click",
        async function () {

            try {

                const playerName =
                    nameInput.value.trim()
                    || "Oyuncu";


                const roomCode =
                    roomInput.value.trim();


                /*
                Kod kontrolü
                */

                if (
                    roomCode.length !== 4 ||
                    !/^\d{4}$/.test(roomCode)
                ) {

                    showStatus(
                        "Lütfen 4 haneli oda kodu gir.",
                        "error"
                    );

                    return;

                }


                joinRoomButton.disabled =
                    true;


                showStatus(
                    "Oda aranıyor...",
                    "waiting"
                );


                /*
                Odayı Firebase'den al
                */

                const roomRef =
                    ref(
                        db,
                        "rooms/" +
                        roomCode
                    );


                const snapshot =
                    await get(roomRef);


                if (!snapshot.exists()) {

                    showStatus(
                        "Bu oda bulunamadı.",
                        "error"
                    );

                    return;

                }


                const room =
                    snapshot.val();


                /*
                Oyuncu sayısını kontrol et
                */

                const players =
                    room.players || {};


                const playerCount =
                    Object.keys(players).length;


                if (playerCount >= 2) {

                    showStatus(
                        "Bu oda dolu.",
                        "error"
                    );

                    return;

                }


                /*
                Yeni oyuncu ID
                */

                const playerId =
                    "player_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2, 8);


                /*
                Oyuncuyu Firebase'e ekle
                */

                await set(
                    ref(
                        db,
                        "rooms/" +
                        roomCode +
                        "/players/" +
                        playerId
                    ),
                    {

                        name:
                            playerName,

                        joinedAt:
                            Date.now(),

                        host:
                            false

                    }
                );


                /*
                Odayı kaydet
                */

                currentRoom =
                    roomCode;

                currentPlayer =
                    playerId;


                /*
                Odayı aç
                */

                openRoom(
                    roomCode
                );


            }
            catch (error) {

                console.error(
                    "Odaya katılma hatası:",
                    error
                );


                showStatus(
                    "Odaya katılınamadı: " +
                    error.message,
                    "error"
                );

            }
            finally {

                joinRoomButton.disabled =
                    false;

            }

        }
    );


    /*
    =====================================================
    ODAYI AÇ
    =====================================================
    */

    function openRoom(
        roomCode
    ) {

        lobby.classList.add(
            "hidden"
        );


        roomPanel.classList.remove(
            "hidden"
        );


        roomCodeDisplay.textContent =
            roomCode;


        listenToRoom(
            roomCode
        );

    }


    /*
    =====================================================
    FIREBASE'DEN ODAYI DİNLE
    =====================================================
    */

    function listenToRoom(
        roomCode
    ) {

        const roomRef =
            ref(
                db,
                "rooms/" +
                roomCode
            );


        playersListener =
            onValue(
                roomRef,
                function (snapshot) {

                    if (
                        !snapshot.exists()
                    ) {

                        roomStatus.textContent =
                            "Oda artık mevcut değil.";

                        playersList.innerHTML =
                            "";

                        return;

                    }


                    const room =
                        snapshot.val();


                    const players =
                        room.players || {};


                    updatePlayers(
                        players
                    );


                    const playerCount =
                        Object.keys(players).length;


                    if (
                        playerCount < 2
                    ) {

                        roomStatus.textContent =
                            "Oyuncu bekleniyor...";

                        roomStatus.className =
                            "waiting";

                    }
                    else {

                        roomStatus.textContent =
                            "Oyun başlayabilir!";

                        roomStatus.className =
                            "success";

                    }

                }
            );

    }


    /*
    =====================================================
    OYUNCULARI EKRANA YAZ
    =====================================================
    */

    function updatePlayers(
        players
    ) {

        playersList.innerHTML =
            "";


        const playerIds =
            Object.keys(players);


        if (
            playerIds.length === 0
        ) {

            playersList.textContent =
                "Henüz oyuncu yok.";

            return;

        }


        playerIds.forEach(
            function (playerId) {

                const player =
                    players[playerId];


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "player";


                div.textContent =
                    "👤 " +
                    player.name +
                    (
                        player.host
                            ? " 👑"
                            : ""
                    );


                playersList.appendChild(
                    div
                );

            }
        );

    }


    /*
    =====================================================
    ODADAN AYRIL
    =====================================================
    */

    leaveRoomButton.addEventListener(
        "click",
        async function () {

            try {

                if (
                    currentRoom &&
                    currentPlayer
                ) {

                    await remove(
                        ref(
                            db,
                            "rooms/" +
                            currentRoom +
                            "/players/" +
                            currentPlayer
                        )
                    );

                }


                /*
                Değişkenleri temizle
                */

                currentRoom =
                    null;

                currentPlayer =
                    null;


                /*
                Odaya dön
                */

                roomPanel.classList.add(
                    "hidden"
                );


                lobby.classList.remove(
                    "hidden"
                );


                roomInput.value =
                    "";


                showStatus(
                    "Odadan ayrıldın.",
                    "success"
                );

            }
            catch (error) {

                console.error(
                    "Odadan ayrılma hatası:",
                    error
                );

            }

        }
    );


    /*
    =====================================================
    TEST
    =====================================================
    */

    console.log(
        "Firebase bağlantısı başlatıldı."
    );

</script>

</body>
</html>
