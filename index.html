<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 Kumarhane Monopoly</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0d0d;color:#eee;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;max-width:1920px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#1a1a1a;border-bottom:1px solid #333;flex-shrink:0}
.room-code{font-size:24px;font-weight:bold;color:#22c55e;letter-spacing:3px}
.status{font-size:16px;font-weight:bold}
.main{flex:1;display:grid;grid-template-columns:280px 1fr 300px;gap:10px;padding:10px;min-height:0}
.left,.right{display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.panel{background:#1e1e1e;border:1px solid #333;border-radius:10px;padding:12px}
.player-card{background:#252525;border-radius:8px;padding:10px;margin-bottom:8px;border:1px solid #444}
.player-card.active{border-color:#22c55e}
.money{font-size:20px;color:#fbbf24;font-weight:bold}
.board-area{display:flex;align-items:center;justify-content:center;min-height:0}
.board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);width:min(820px,100%);height:min(820px,100%);gap:2px;background:#111;border:3px solid #555;border-radius:6px}
.cell{background:#2a2a2a;border:1px solid #444;font-size:10px;padding:2px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;position:relative;line-height:1.1}
.cell .name{font-weight:bold;font-size:9px}
.cell .price{font-size:8px;color:#aaa}
.cell .owner{position:absolute;bottom:1px;right:2px;font-size:9px}
.pieces{display:flex;flex-wrap:wrap;gap:1px;justify-content:center}
.piece{background:#facc15;color:#111;border-radius:8px;padding:1px 4px;font-size:9px;font-weight:bold}
.start{background:#14532d!important}
.jail{background:#3f1a1a!important}
.special{background:#3b2a0b!important;border-color:#f59e0b!important}
.poker{background:#2e1a3d!important;border-color:#a855f7!important}
.center{grid-column:2/9;grid-row:2/9;background:#151515;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;color:#555;border:none;gap:12px}
.dice-box{display:flex;gap:16px;align-items:center;justify-content:center}
.die{width:64px;height:64px;background:#fff;border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;box-shadow:0 4px 12px #0008;border:2px solid #ccc}
.die span{width:10px;height:10px;background:#111;border-radius:50%;margin:auto}
.die .d1{grid-area:2/2}
.die .d2a{grid-area:1/1}.die .d2b{grid-area:3/3}
.die .d3a{grid-area:1/1}.die .d3b{grid-area:2/2}.die .d3c{grid-area:3/3}
.die .d4a{grid-area:1/1}.die .d4b{grid-area:1/3}.die .d4c{grid-area:3/1}.die .d4d{grid-area:3/3}
.die .d5a{grid-area:1/1}.die .d5b{grid-area:1/3}.die .d5c{grid-area:2/2}.die .d5d{grid-area:3/1}.die .d5e{grid-area:3/3}
.die .d6a{grid-area:1/1}.die .d6b{grid-area:1/3}.die .d6c{grid-area:2/1}.die .d6d{grid-area:2/3}.die .d6e{grid-area:3/1}.die .d6f{grid-area:3/3}
.dice-total{font-size:28px;font-weight:bold;color:#fbbf24;min-height:34px}
#cell-0{grid-column:1;grid-row:9}#cell-1{grid-column:2;grid-row:9}#cell-2{grid-column:3;grid-row:9}#cell-3{grid-column:4;grid-row:9}
#cell-4{grid-column:5;grid-row:9}#cell-5{grid-column:6;grid-row:9}#cell-6{grid-column:7;grid-row:9}#cell-7{grid-column:8;grid-row:9}
#cell-8{grid-column:9;grid-row:9}#
